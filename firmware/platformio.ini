; Configuración de PlatformIO para el ESP32 del Billy Bass
; Chip detectado: ESP32-D0WD-V3 (rev 3.1), 4MB flash, puerto COM5

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM5
monitor_port = COM5
; El stack de Bluetooth Clásico no cabe en la partición por defecto (1.3 MB): huge_app da 3 MB (sin OTA)
board_build.partitions = huge_app.csv
lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP

; Programa principal con el micrófono como fuente de audio (en vez de Bluetooth)
[env:micsync]
extends = env:esp32dev
build_flags = -DAUDIO_SOURCE_MIC

; Micrófono → PC por WiFi para escuchar su calidad: pio run -e micstream -t upload
; Requiere src/secrets.h (copiar src/secrets.example.h). En la PC: python server/mic_receiver.py
[env:micstream]
extends = env:esp32dev
lib_deps =
build_src_filter = -<*> +<../tools/micstream.cpp> +<mic_dma.cpp> +<voice_link.cpp> +<motors.cpp> +<mouth_sync.cpp>

; Programa principal (Bluetooth + boca) más comandos de voz por WiFi: pio run -e bassvoice -t upload
; Requiere src/secrets.h. En la PC: python server/voice_server.py (y tools/usb_speaker.py para oír la música)
[env:bassvoice]
extends = env:esp32dev
build_flags = -DVOICE_COMMANDS

; Comandos por voz sin Bluetooth: pio run -e voicecmd -t upload. En la PC: python server/voice_server.py
[env:voicecmd]
extends = env:esp32dev
lib_deps =
build_src_filter = -<*> +<../tools/voicecmd.cpp> +<mic_dma.cpp> +<voice_link.cpp> +<motors.cpp> +<gestures.cpp>

; Herramienta para identificar pines: pio run -e pinfinder -t upload
[env:pinfinder]
extends = env:esp32dev
build_src_filter = -<*> +<../tools/pinfinder.cpp>

; Prueba de motores sin PWM: pio run -e motortest -t upload
[env:motortest]
extends = env:esp32dev
build_src_filter = -<*> +<../tools/motortest.cpp>

; Prueba del micrófono: pio run -e mictest -t upload
[env:mictest]
extends = env:esp32dev
build_src_filter = -<*> +<../tools/mictest.cpp>

; Prueba de un solo motor: pio run -e motora -t upload (o -e motorb)
[env:motora]
extends = env:esp32dev
build_src_filter = -<*> +<../tools/motor_single_test.cpp>
build_flags = -DMOTOR_NAME='"A"' -DPIN_1=18 -DPIN_2=19

[env:motorb]
extends = env:esp32dev
build_src_filter = -<*> +<../tools/motor_single_test.cpp>
build_flags = -DMOTOR_NAME='"B"' -DPIN_1=16 -DPIN_2=17

; Vaivén del MOTOR B (derecha/izquierda cada 250 ms): pio run -e motorb_wiggle -t upload
[env:motorb_wiggle]
extends = env:esp32dev
build_src_filter = -<*> +<../tools/motor_single_test.cpp>
build_flags = -DMOTOR_NAME='"B"' -DPIN_1=16 -DPIN_2=17 -DWIGGLE_MS=250

; Pausa: todos los motores apagados: pio run -e idle -t upload
[env:idle]
extends = env:esp32dev
build_src_filter = -<*> +<../tools/idle.cpp>
